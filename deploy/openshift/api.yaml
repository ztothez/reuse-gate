apiVersion: apps/v1
kind: Deployment
metadata:
  name: reuse-gate
  labels: {app: reuse-gate}
spec:
  replicas: 1
  selector:
    matchLabels: {app: reuse-gate}
  template:
    metadata:
      labels: {app: reuse-gate}
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/ztothez-dev/reuse-gate:latest
          ports:
            - containerPort: 8080
          # Keys come from secrets. optional: the API runs rules-only, and Listen says so, if a secret is missing.
          env:
            - name: AITTA_API_KEY
              valueFrom:
                secretKeyRef: {name: reuse-gate-llm, key: AITTA_API_KEY, optional: true}
            - name: FEATHERLESS_API_KEY
              valueFrom:
                secretKeyRef: {name: reuse-gate-llm, key: FEATHERLESS_API_KEY, optional: true}
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef: {name: reuse-gate-elevenlabs, key: ELEVENLABS_API_KEY, optional: true}
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef: {name: reuse-gate-n8n, key: N8N_API_KEY, optional: true}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: reuse-gate
spec:
  selector: {app: reuse-gate}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: reuse-gate
  annotations:
    haproxy.router.openshift.io/timeout: 90s  # above LLM_REQUEST_DEADLINE, or a slow failover gets a 504 from the router
spec:
  to: {kind: Service, name: reuse-gate}
  port: {targetPort: 8080}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
