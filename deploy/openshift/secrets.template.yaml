# Secret template. Placeholder values only: never commit real keys. Not applied by apply.sh or rollout.sh.
# Do NOT oc apply this file to a project that already has the secrets: it would replace the real keys with REPLACE_ME.
# Prefer creating the secrets from your shell, so no key is written to a file:
#   oc create secret generic reuse-gate-llm --from-literal=AITTA_API_KEY="$AITTA_API_KEY" \
#     --from-literal=FEATHERLESS_API_KEY="$FEATHERLESS_API_KEY" --from-literal=TOGETHER_API_KEY="$TOGETHER_API_KEY"
#   oc create secret generic reuse-gate-access --from-literal=REUSE_GATE_WRITE_TOKEN="$REUSE_GATE_WRITE_TOKEN"
# To add one key to an existing secret:
#   oc set data secret/reuse-gate-llm TOGETHER_API_KEY="$TOGETHER_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: reuse-gate-llm
  labels: {app.kubernetes.io/part-of: reuse-gate}
type: Opaque
stringData:
  AITTA_API_KEY: REPLACE_ME
  FEATHERLESS_API_KEY: REPLACE_ME
  TOGETHER_API_KEY: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: reuse-gate-elevenlabs
  labels: {app.kubernetes.io/part-of: reuse-gate}
type: Opaque
stringData:
  ELEVENLABS_API_KEY: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: reuse-gate-n8n
  labels: {app.kubernetes.io/part-of: reuse-gate}
type: Opaque
stringData:
  N8N_API_KEY: REPLACE_ME
  N8N_WEBHOOK_SECRET: REPLACE_ME  # the value of the n8n credential "Reuse Gate webhook secret"
  REUSE_GATE_NOTIFY_EMAILS: approver:REPLACE@example.com;business:REPLACE@example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: reuse-gate-access
  labels: {app.kubernetes.io/part-of: reuse-gate}
type: Opaque
stringData:
  REUSE_GATE_WRITE_TOKEN: REPLACE_ME
  # Roles: business, analyst, developer, approver, admin, executive, operator
  REUSE_GATE_ROLE_CODES: business:REPLACE_NAME:REPLACE_CODE;approver:REPLACE_NAME:REPLACE_CODE
